<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0, 0, c.width, c.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] > 195 && d[i+1] > 190 && d[i+2] > 175) {
      d[i+3] = 0;
    }
  }
  ctx.putImageData(id, 0, 0);
  window.cleanLogoData = c.toDataURL('image/png');
};
img.src = 'assets/brio_logo.png';
</script>
</body>
</html>
